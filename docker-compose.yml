services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mi-api
    container_name: inventario-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
    volumes:
      - sqlite-data:/var/www/html/database
      - storage-data:/var/www/html/storage
    command: >
      sh -c "php artisan migrate --force && apache2-foreground"

volumes:
  sqlite-data:
  storage-data:
