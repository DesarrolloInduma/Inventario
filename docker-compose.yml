services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mi-api
    container_name: inventario-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8093:80"
    volumes:
      - storage-data:/var/www/html/storage
    command: >
      sh -c "php artisan migrate --force || echo 'Migraciones omitidas: revisar DB_PASSWORD' && exec apache2-foreground"

volumes:
  storage-data:
