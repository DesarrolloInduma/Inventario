services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: inventario-candidate:local
    container_name: inventario-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8093:80"
    volumes:
      - storage-data:/var/www/html/storage
    command: ["apache2-foreground"]

volumes:
  storage-data:
